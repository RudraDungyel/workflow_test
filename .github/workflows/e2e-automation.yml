name: E2E Automation Playwright

on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --user root
    outputs:
      should_deploy: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Skip if Bhutan time isn't 05:00
        id: guard
        run: |
          HOUR=$(TZ=Asia/Thimphu date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "05" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Bhutan hour is $HOUR, expected 05."
          fi

      - name: Checkout
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
            ref: automation

      - name: Install dependencies
        if: steps.guard.outputs.proceed == 'true'
        run: npm ci

      - name: Run Playwright tests
        if: steps.guard.outputs.proceed == 'true'
        run: npx playwright test --project=chromium
        env:
          CI: 'true'

      - name: Upload HTML report (artifact)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 30

      - name: Upload client-friendly report (CSV + summary HTML)
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: client-report-${{ github.run_id }}
          path: client-report
          retention-days: 30

      - name: Upload traces and screenshots
        if: failure() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results
          retention-days: 14

      - name: Stage client summary for Pages
        if: always() && steps.guard.outputs.proceed == 'true'
        run: cp client-report/client-summary.html client-report/index.html

      - name: Upload report for Pages
        if: always() && steps.guard.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client-report

  deploy-pages:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && needs.test.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
